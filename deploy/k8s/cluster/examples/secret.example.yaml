# 示例：复制为 deploy/k8s/cluster/secret.yaml 后填入真实凭据，再创建 Secret。
#
#   cp deploy/k8s/cluster/examples/secret.example.yaml deploy/k8s/cluster/secret.yaml
#   kubectl apply -f deploy/k8s/cluster/secret.yaml
#
# deploy/k8s/cluster/secret.yaml 已被 .gitignore 排除，真实凭据绝不要提交。
# 该目录（examples/）不在 `kubectl apply -f deploy/k8s/cluster/` 的
# 非递归范围内，避免误用占位凭据把服务跑起来。
#
# BLINK_CLUSTER_SECRET 是节点间 HMAC 共享密钥，集群模式**必填**且
# **至少 32 字节**；缺失或过短时进程拒绝启动。生成方式：
#
#   openssl rand -base64 32
#
# 三个节点共用同一个值。轮换需要全集群同时重启，期间无法完成跨节点请求。
apiVersion: v1
kind: Secret
metadata:
  name: blink-credentials
  namespace: blink
  labels:
    app.kubernetes.io/name: blink
type: Opaque
stringData:
  BLINK_ACCESS_KEY: "REPLACE_WITH_ACCESS_KEY"
  BLINK_SECRET_KEY: "REPLACE_WITH_SECRET_KEY"
  BLINK_CLUSTER_SECRET: "REPLACE_WITH_AT_LEAST_32_BYTES_RANDOM_SECRET"
