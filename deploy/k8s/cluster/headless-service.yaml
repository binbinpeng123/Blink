# Headless Service：为每个 Pod 提供稳定 DNS。
#
# 节点间使用 <pod>.<service>.<namespace>.svc.<cluster-domain> 寻址；
# 同 namespace 内可简写为 <pod>.<service>。Pod 名来自 StatefulSet，
# 因此 blink-0 / blink-1 / blink-2 的身份在重启后保持不变。
#
# clusterIP: None 使 DNS 直接返回 Pod IP，不经过 Service 负载均衡：
# 节点间请求必须打到确定的那个 Pod，不能随机落到任意副本。
#
# publishNotReadyAddresses: true 让尚未就绪的 Pod 也有 DNS 记录。
# 集群节点启动时 peer 可能仍在启动，解析不到只会让首次请求失败；
# 但若 DNS 记录本身缺失，问题会更难区分。
apiVersion: v1
kind: Service
metadata:
  name: blink-headless
  namespace: blink
  labels:
    app.kubernetes.io/name: blink
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: blink
  ports:
    # S3 端口也挂在这里，便于 Pod 间直连排查；对外流量仍走 service.yaml
    # 的普通 ClusterIP。
    - name: s3
      port: 9000
      targetPort: s3
      protocol: TCP
    - name: internal
      port: 9100
      targetPort: internal
      protocol: TCP
