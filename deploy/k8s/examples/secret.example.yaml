# 示例：复制为 deploy/k8s/secret.yaml 后填入真实凭据，再创建 Secret。
#
#   cp deploy/k8s/examples/secret.example.yaml deploy/k8s/secret.yaml
#   kubectl apply -f deploy/k8s/secret.yaml
#
# deploy/k8s/secret.yaml 已被 .gitignore 排除，真实凭据绝不要提交。
# 该目录（examples/）不在 `kubectl apply -f deploy/k8s/` 的非递归范围内，
# 避免误用占位凭据把服务跑起来。
apiVersion: v1
kind: Secret
metadata:
  name: blink-credentials
  namespace: blink
  labels:
    app.kubernetes.io/name: blink
type: Opaque
stringData:
  BLINK_ACCESS_KEY: "REPLACE_WITH_ACCESS_KEY"
  BLINK_SECRET_KEY: "REPLACE_WITH_SECRET_KEY"
